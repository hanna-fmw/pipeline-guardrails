# The kit tests itself: the checks workflow run on this repo, plus tests/run.sh.
# Green on main: the release job tags it (next patch) and moves v1. scripts/release.sh is for minor/major bumps.
name: selftest
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gitleaks (the version and checksum checks.yml pins)
        run: |
          v=$(grep -oE 'GITLEAKS_VERSION: [0-9.]+' .github/workflows/checks.yml | cut -d' ' -f2)
          f="gitleaks_${v}_linux_x64.tar.gz"
          curl -sSLo "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${v}/$f"
          sed -n '/GITLEAKS_VERSION:/,/sha256sum/p' .github/workflows/checks.yml | grep -oE '[0-9a-f]{64}  \$f' | sed "s/\$f/$f/" | sha256sum -c --quiet
          tar -xzf "$f" gitleaks && sudo mv gitleaks /usr/local/bin/
      - run: bash tests/run.sh

  release:
    # Every green main is released by itself (Hanna, 2026-10-28: no manual release step): the next patch
    # version, and the major tag (v1) every repo pins moves to it. A minor or major bump: scripts/release.sh.
    needs: [checks, tests]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          git fetch -q --tags --force
          last=$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)
          [ "$(git rev-list -n1 "$last")" != "$GITHUB_SHA" ] || { echo "$last is this commit already"; exit 0; }
          IFS=. read -r M m p <<<"${last#v}"
          v="v$M.$m.$((p + 1))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$v" -m "$v" && git tag -fa "v$M" -m "v$M -> $v"
          git push -q origin "$v" && git push -q -f origin "v$M"
          gh release create "$v" --verify-tag --generate-notes --latest >/dev/null
          echo "released $v; v$M points at it" | tee -a "$GITHUB_STEP_SUMMARY"
