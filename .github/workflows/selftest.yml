# The kit tests itself: the checks workflow run on this repo, plus tests/run.sh.
# Green on main: the release job tags it (next patch); sync.sh moves v1 after the canary. Minor/major: scripts/release.sh.
name: selftest
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gitleaks (the version and checksum checks.yml pins)
        run: |
          v=$(grep -oE 'GITLEAKS_VERSION: [0-9.]+' .github/workflows/checks.yml | cut -d' ' -f2)
          f="gitleaks_${v}_linux_x64.tar.gz"
          curl -sSLo "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${v}/$f"
          sed -n '/GITLEAKS_VERSION:/,/sha256sum/p' .github/workflows/checks.yml | grep -oE '[0-9a-f]{64}  \$f' | sed "s/\$f/$f/" | sha256sum -c --quiet
          tar -xzf "$f" gitleaks && sudo mv gitleaks /usr/local/bin/
      - run: bash tests/run.sh

  release:
    # Every green main is released by itself (Hanna, 2026-10-28: no manual release step) as the next patch
    # version; v1, which every repo runs, moves to it after the canary passes (scripts/release.sh, sync.sh).
    needs: [checks, tests]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set -o pipefail
          bash scripts/release.sh patch --ci | tee -a "$GITHUB_STEP_SUMMARY"
