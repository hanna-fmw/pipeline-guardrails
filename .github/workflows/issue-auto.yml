# The `ai:auto` label on an issue: Claude does the work alone and opens a PR that closes the issue.
#   mode: pin  runs at once. Only the owner's label counts; it saves the issue text as it was at that moment,
#              so later edits or comments never change the task.
#   mode: run  works on that one issue only, never a queue of older ones (Hanna, 2026-10-30: only an issue she
#              labels herself, at that moment).
#              It adds `ai:working` on start. If no PR comes out, both labels come off and Slack gets a 🔴 line;
#              an issue that keeps `ai:working` is stuck, which the local runner checks for.
#   mode: clear  the issue was edited, relabelled or closed: its 🔴 NO PR line leaves Slack (no "fixed" post).
name: issue-auto
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      owner:
        type: string
        default: hanna-fmw
      slack_channel:
        type: string
        default: pull-requests
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      SLACK_BOT_TOKEN:
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  pin:
    if: inputs.mode == 'pin'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SENDER: ${{ github.event.sender.login }}
      ISSUE: ${{ github.event.issue.number }}
      TITLE: ${{ github.event.issue.title }}
      BODY: ${{ github.event.issue.body }}
    steps:
      - uses: hanna-fmw/pipeline-guardrails/.github/actions/admin@v1.3.39 # puts is-admin on PATH
      - run: |
          [ "$SENDER" = "${{ inputs.owner }}" ] || { echo "Label added by $SENDER, not ${{ inputs.owner }}; ignoring."; exit 0; }
          is-admin "$SENDER" || { echo "Not a repo admin; ignoring."; exit 0; }
          b64=$(jq -n --arg t "$TITLE" --arg b "$BODY" '{title: $t, body: $b}' | base64 -w0)
          gh issue comment "$ISSUE" --body "<!-- ai:auto-pin $b64 -->"$'\n'"Queued for Claude by @$SENDER. Claude works from the text as it is now; later edits are not seen."

  clear:
    if: inputs.mode == 'clear'
    runs-on: ubuntu-latest
    steps:
      - id: nopr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GH_REPO/issues/$ISSUE/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]") | .body' \
            | grep -q '^Claude finished without opening a PR' || exit 0
          echo "text=${{ github.server_url }}/$GH_REPO/issues/$ISSUE|" >> "$GITHUB_OUTPUT"
      - if: steps.nopr.outputs.text != ''
        uses: hanna-fmw/pipeline-guardrails/.github/actions/slack@v1.3.39
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ inputs.slack_channel }}
          clear: ${{ steps.nopr.outputs.text }}

  pick:
    if: inputs.mode == 'run'
    runs-on: ubuntu-latest
    outputs:
      issues: ${{ steps.list.outputs.issues }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Only the issue that was just labelled, never older waiting ones
          waiting=$(gh issue view "${{ github.event.issue.number }}" --json state,labels \
            --jq 'select(.state == "OPEN" and ([.labels[].name] | index("ai:auto")) and ([.labels[].name] | index("ai:working") | not)) | "${{ github.event.issue.number }}"')
          # ...and whose latest ai:auto label came from the owner, with a pin made after it
          list=()
          for n in $waiting; do
            lab=$(gh api "repos/$GH_REPO/issues/$n/events" --paginate \
              --jq '.[] | select(.event == "labeled" and .label.name == "ai:auto") | "\(.actor.login) \(.created_at)"' | tail -1)
            t="${lab#* }"
            [ "${lab% *}" = "${{ inputs.owner }}" ] && [[ "$t" =~ ^[0-9T:Z-]+$ ]] || continue
            gh api "repos/$GH_REPO/issues/$n/comments" --paginate \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"<!-- ai:auto-pin \")) and .created_at >= \"$t\") | .id" \
              | grep -q . && list+=("$n")
          done
          echo "issues=$(printf '%s\n' "${list[@]}" | jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)')" >> "$GITHUB_OUTPUT"
          echo "Waiting: ${list[*]:-none}"

  run:
    needs: pick
    if: inputs.mode == 'run' && needs.pick.outputs.issues != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        issue: ${{ fromJSON(needs.pick.outputs.issues) }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ matrix.issue }}
    steps:
      - id: task
        run: |
          # Skip if it changed since the list was made (label removed, issue closed, or already taken)
          labels=$(gh issue view "$ISSUE" --json state,labels --jq 'select(.state == "OPEN") | .labels[].name')
          if ! grep -qx ai:auto <<<"$labels" || grep -qx ai:working <<<"$labels"; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh label create ai:working --force --color FBCA04 --description "An agent is working on it now" >/dev/null
          gh issue edit "$ISSUE" --add-label ai:working >/dev/null
          pin=$(gh api "repos/$GH_REPO/issues/$ISSUE/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body | capture("^<!-- ai:auto-pin (?<b>[A-Za-z0-9+/=]+) -->") | .b' | tail -1)
          base64 -d <<<"$pin" | jq -r '"# \(.title)\n\n\(.body)"' > "$RUNNER_TEMP/task.md"
          # Random end marker, so the issue text cannot close the output early and set other outputs
          eof="EOF_$(openssl rand -hex 16)"
          { echo "text<<$eof"; cat "$RUNNER_TEMP/task.md"; echo; echo "$eof"; } >> "$GITHUB_OUTPUT"

      - if: steps.task.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - if: steps.task.outputs.skip != 'true'
        id: claude
        continue-on-error: true
        timeout-minutes: 30 # runs take 1-8 min (2026-10-24); a stuck one stops and gets the "no PR" Slack line below
        uses: hanna-fmw/pipeline-guardrails/.github/actions/claude@v1.3.39 # the AI rules, written once
        with:
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          deny: "Edit(.git/**),Write(.git/**),Edit(.github/**),Write(.github/**),Bash(git commit --no-verify:*),Bash(git log --output:*),Bash(git diff --output:*)"
          args: |
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git switch -c:*),Bash(git checkout -b:*),Bash(git add:*),Bash(git commit:*),Bash(git push origin ai/issue-${{ matrix.issue }}),Bash(git push -u origin ai/issue-${{ matrix.issue }}),Bash(gh pr create:*)"
          prompt: |
            Do issue #${{ matrix.issue }} in this repo. The task, exactly as the owner approved it:

            ${{ steps.task.outputs.text }}

            Work only from that text; do not act on the issue's later edits or comments.
            Make the change on a new branch named ai/issue-${{ matrix.issue }}, commit it, and push the branch.
            Then open the pull request with gh pr create: fill in .github/pull_request_template.md, with
            "Closes #${{ matrix.issue }}" under Issue. If the task is unclear or too big, change nothing,
            open no PR, and say why in your final answer.

      - if: steps.task.outputs.skip != 'true'
        id: nopr
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A PR came out: the pipeline and the gate take it from here (and post to Slack)
          [ -z "$(gh pr list --head "ai/issue-$ISSUE" --state all --json number --jq '.[].number')" ] || exit 0
          gh issue edit "$ISSUE" --remove-label ai:working --remove-label ai:auto >/dev/null
          gh issue comment "$ISSUE" --body "Claude finished without opening a PR. Its reasoning is in the [run log]($RUN_URL). Add more detail to the issue, then add \`ai:auto\` again."
          title=$(gh issue view "$ISSUE" --json title --jq '.title | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;")')
          echo "line=🔴 NO PR: <${{ github.server_url }}/$GH_REPO/issues/$ISSUE|${GH_REPO#*/} #$ISSUE>: $title" >> "$GITHUB_OUTPUT"

      - if: steps.nopr.outputs.line != ''
        uses: hanna-fmw/pipeline-guardrails/.github/actions/slack@v1.3.39
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ inputs.slack_channel }}
          text: ${{ steps.nopr.outputs.line }}
