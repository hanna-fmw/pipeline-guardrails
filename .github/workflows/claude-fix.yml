# "@claude <what to do>" in a PR comment: Claude makes the change and pushes it to the PR branch.
# In an issue: Claude does the work on a new branch and opens a PR that closes the issue.
# Its push comes from the Claude GitHub App, so the whole pipeline runs again on the new commit.
name: claude-fix
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  admin:
    # Only repo admins may start this: the owner on a personal repo, an org admin on an org repo
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        uses: hanna-fmw/pipeline-guardrails/.github/actions/admin@v1

  claude:
    needs: admin
    if: needs.admin.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so Claude can merge main into the branch
      - uses: anthropics/claude-code-action@v1
        timeout-minutes: 30 # runs take 1-8 min (2026-10-24); a stuck one stops and says so below
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          claude_args: |
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git fetch:*),Bash(git merge:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(gh pr create:*)"
            --disallowedTools "Edit(.git/**),Write(.git/**),Edit(.github/**),Write(.github/**),Bash(git commit --no-verify:*),Bash(git merge --abort:*)"
            --append-system-prompt "When you were called from an issue, finish by opening the pull request yourself with gh pr create: fill in .github/pull_request_template.md and put 'Closes #<issue number>' in the description. To bring a PR branch up to date: git fetch origin main, git merge origin/main, resolve the conflicts by editing the files, commit, push. You cannot run the tests here; the checks run on GitHub after your push, so read failing test output from the PR's Checks and fix the code."
      - name: Say where it stopped
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number || github.event.pull_request.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh issue comment "$N" -R "$GITHUB_REPOSITORY" --body "Claude stopped before finishing (30-minute limit or an error, [log]($RUN)). Comment \`@claude\` again to retry."
