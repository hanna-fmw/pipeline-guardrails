# "@claude <what to do>" in a PR comment: Claude makes the change and pushes it to the PR branch.
# In an issue: Claude does the work on a new branch and opens a PR that closes the issue.
# Its push comes from the Claude GitHub App, so the whole pipeline runs again on the new commit.
# With task and branch (the router, after the gate found a PR red): Claude fixes that branch by itself.
name: claude-fix
on:
  workflow_call:
    inputs:
      task:
        type: string
        default: ""
      branch:
        type: string
        default: ""
    outputs:
      pushed:
        description: true when an automatic round pushed a new commit
        value: ${{ jobs.claude.outputs.pushed }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  admin:
    # Only repo admins may start this: the owner on a personal repo, an org admin on an org repo
    if: inputs.task == '' # an automatic round comes from the gate, not a person
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        uses: hanna-fmw/pipeline-guardrails/.github/actions/admin@v1.3.40

  claude:
    needs: admin
    if: ${{ !cancelled() && (inputs.task != '' || needs.admin.outputs.ok == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.pushed.outputs.pushed }}
    env:
      BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }} # empty: the event's own ref
          fetch-depth: 0 # full history, so Claude can merge main into the branch
          persist-credentials: false # else this token, not the Claude app's, pushes, and GitHub holds the new run for approval
      - id: before
        if: inputs.task != ''
        run: echo "sha=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: hanna-fmw/pipeline-guardrails/.github/actions/claude@v1.3.40 # the AI rules, written once
        timeout-minutes: 30 # runs take 1-8 min (2026-10-24); a stuck one stops and says so below
        with:
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ inputs.task }}
          allowed_bots: ${{ inputs.task && 'claude,dependabot' || '' }} # a fix round follows the Claude bot's or Dependabot's push
          deny: "Read(.git/**),Edit(.git/**),Write(.git/**),Edit(.github/**),Write(.github/**),Bash(git commit --no-verify:*),Bash(git * --output*),Bash(git * --ext-diff*),Bash(git * --no-index*),Bash(git -c *),Bash(git * -c *)"
          instructions: "When you were called from an issue, finish by opening the pull request yourself with gh pr create: fill in .github/pull_request_template.md, with 'Closes #<issue number>' under Issue. To bring a PR branch up to date: git fetch origin main, git merge origin/main, resolve the conflicts by editing the files, commit, push. You cannot run the tests here; the checks run on GitHub after your push, so fix the code from the failure output you were given."
          args: |
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git fetch origin main),Bash(git merge origin/main),Bash(git merge --no-edit origin/main),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(gh pr create:*)${{ inputs.branch && format(',Bash(git push origin HEAD:{0})', inputs.branch) || '' }}"
      - id: pushed
        if: always() && inputs.task != ''
        env:
          BEFORE: ${{ steps.before.outputs.sha }}
        run: |
          now=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          [ -n "$now" ] && [ "$now" != "$BEFORE" ] && echo "pushed=true" >> "$GITHUB_OUTPUT" || true
      - name: Say where it stopped
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number || github.event.pull_request.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh issue comment "$N" -R "$GITHUB_REPOSITORY" --body "Claude stopped before finishing (30-minute limit or an error, [log]($RUN)). Comment \`@claude\` again to retry."
