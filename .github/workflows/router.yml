# The whole pipeline, routed by event: PR checks, both Claude reviews, the gate, and the commands
# (@claude, /gate, /revert, ai:auto, owner-approved). Repo variable PIPELINE_MODE=light: checks only, no Claude
# reviews, and the gate merges a green PR by itself. Every repo's .github/workflows/pipeline.yml only
# calls this file, the same in every repo (templates/.github/workflows/pipeline.yml), so a change here
# reaches every repo with the next release and no repo file ever changes.
name: router
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      SLACK_BOT_TOKEN:
        required: false

jobs:
  checks:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action)
    concurrency:
      group: checks-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: hanna-fmw/pipeline-guardrails/.github/workflows/checks.yml@v1
    permissions:
      contents: read

  review:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) && vars.PIPELINE_MODE != 'light' # light mode: checks only
    concurrency:
      group: review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: hanna-fmw/pipeline-guardrails/.github/workflows/claude-review.yml@v1
    with:
      kind: review
      depth: ${{ vars.PIPELINE_DEPTH || 'standard' }} # repo variable PIPELINE_DEPTH: quick | standard | deep
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

  security:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) && vars.PIPELINE_MODE != 'light' # light mode: checks only
    concurrency:
      group: security-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: hanna-fmw/pipeline-guardrails/.github/workflows/claude-review.yml@v1
    with:
      kind: security
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

  gate:
    if: always() && github.event_name == 'pull_request' && contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action)
    concurrency:
      group: gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    needs: [checks, review, security]
    uses: hanna-fmw/pipeline-guardrails/.github/workflows/gate.yml@v1
    with:
      pr: ${{ github.event.pull_request.number }}
      new_commits: ${{ github.event.action == 'synchronize' }}
      autofix: true
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read

  autofix: # a PR from this repo is red: Claude gets the failure and fixes it (the gate counts the rounds, at most 3)
    needs: gate
    if: always() && needs.gate.outputs.fix != ''
    concurrency:
      group: autofix-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    uses: hanna-fmw/pipeline-guardrails/.github/workflows/claude-fix.yml@v1
    with:
      task: ${{ needs.gate.outputs.fix }}
      branch: ${{ needs.gate.outputs.branch }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

  autofix-stalled: # a round that pushed nothing ends the loop: the gate hands the PR to Hanna
    needs: autofix
    if: always() && needs.autofix.result != 'skipped' && needs.autofix.outputs.pushed != 'true'
    uses: hanna-fmw/pipeline-guardrails/.github/workflows/gate.yml@v1
    with:
      pr: ${{ github.event.pull_request.number }}
      stalled: true
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read

  fix:
    if: >-
      ((github.event_name == 'pull_request_review_comment' || github.event_name == 'issue_comment')
        && contains(github.event.comment.body, '@claude') && github.event.comment.author_association != 'NONE')
      || (github.event_name == 'issues' && github.event.action == 'opened'
        && contains(github.event.issue.body, '@claude') && github.event.issue.author_association != 'NONE')
    uses: hanna-fmw/pipeline-guardrails/.github/workflows/claude-fix.yml@v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

  gate-command:
    if: >-
      (github.event_name == 'pull_request' && (github.event.action == 'closed' || github.event.label.name == 'owner-approved'))
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request
          && startsWith(github.event.comment.body, '/gate') && github.event.comment.author_association != 'NONE')
    uses: hanna-fmw/pipeline-guardrails/.github/workflows/gate.yml@v1
    with:
      pr: ${{ github.event.pull_request.number || github.event.issue.number }}
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read

  auto-pin:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'ai:auto'
    uses: hanna-fmw/pipeline-guardrails/.github/workflows/issue-auto.yml@v1
    with:
      mode: pin
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

  auto-clear: # an issue that got no PR: its Slack line goes once the issue is edited, relabelled or closed
    if: >-
      github.event_name == 'issues'
      && (github.event.action == 'edited' || github.event.action == 'closed' || github.event.label.name == 'ai:auto')
    uses: hanna-fmw/pipeline-guardrails/.github/workflows/issue-auto.yml@v1
    with:
      mode: clear
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

  auto-run:
    needs: auto-pin
    concurrency: # one issue per repo at a time; later ones wait, never cancel
      group: ai-auto
      cancel-in-progress: false
    uses: hanna-fmw/pipeline-guardrails/.github/workflows/issue-auto.yml@v1
    with:
      mode: run
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

  revert:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/revert') && github.event.comment.author_association != 'NONE'
    uses: hanna-fmw/pipeline-guardrails/.github/workflows/revert.yml@v1
    with:
      pr: ${{ github.event.issue.number }}
    permissions:
      contents: write
      pull-requests: write
