# Required checks: lint, types, tests, build, workflow, shell and Python lint, leaked secrets, vulnerable packages.
# Runs whichever of the package.json scripts lint / typecheck / test / build exist.
name: checks
on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect package manager
        id: pm
        run: |
          # pnpm's version comes from package.json "packageManager"; without it, use pnpm 10
          jq -e '.packageManager' package.json >/dev/null 2>&1 || echo "pnpm_version=10" >> "$GITHUB_OUTPUT"
          if [ -f pnpm-lock.yaml ]; then echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f package.json ]; then echo "pm=npm" >> "$GITHUB_OUTPUT"
          else echo "pm=none" >> "$GITHUB_OUTPUT"; fi

      - if: steps.pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pm.outputs.pnpm_version }}
      - if: steps.pm.outputs.pm != 'none'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ hashFiles('.nvmrc') == '' && 'lts/*' || '' }}
          node-version-file: ${{ hashFiles('.nvmrc') != '' && '.nvmrc' || '' }}
          cache: ${{ steps.pm.outputs.pm }}

      - name: Install
        if: steps.pm.outputs.pm != 'none'
        run: |
          if [ "${{ steps.pm.outputs.pm }}" = pnpm ]; then pnpm install --frozen-lockfile
          else npm ci; fi

      - name: Lint, types, tests, build
        if: steps.pm.outputs.pm != 'none'
        run: |
          for s in lint typecheck test build; do
            if jq -e --arg s "$s" '.scripts[$s]' package.json >/dev/null; then
              echo "::group::$s"; ${{ steps.pm.outputs.pm }} run "$s"; echo "::endgroup::"
            else
              echo "No '$s' script, skipped."
            fi
          done

      - name: Workflow, shell and Python lint
        run: |
          if compgen -G ".github/workflows/*.y*ml" >/dev/null; then
            f=actionlint_1.7.12_linux_amd64.tar.gz
            curl -sSLo "$f" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$f"
            echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $f" | sha256sum -c --quiet
            tar -xzf "$f" actionlint
            SHELLCHECK_OPTS="-e SC2016" ./actionlint -color # same exception as the shell-script lint below
          fi
          # Shell scripts: *.sh plus extensionless files whose first line is a sh/bash shebang
          mapfile -t sh < <(git ls-files -z | while IFS= read -r -d '' f; do
            case ${f##*/} in *.sh) echo "$f" ;; *.*) ;; *) [ -f "$f" ] && head -1 "$f" | grep -qE '^#!.*\b(ba)?sh\b' && echo "$f" ;; esac; done)
          [ ${#sh[@]} -eq 0 ] || shellcheck -e SC2016 "${sh[@]}" # SC2016: '$x' in single quotes is usually meant (GraphQL, jq)
          if [ -n "$(git ls-files '*.py')" ]; then pipx run ruff==0.17.0 check .; fi

      - name: Vulnerable packages (high and critical, production only)
        if: steps.pm.outputs.pm != 'none'
        run: |
          if [ "${{ steps.pm.outputs.pm }}" = pnpm ]; then pnpm audit --prod --audit-level high
          else npm audit --omit=dev --audit-level=high; fi

      - name: Leaked secrets in this PR's commits
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_VERSION: 8.30.1 # the one gitleaks pin: bump with the checksum below; ops reads this exact line shape
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLo "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $f" | sha256sum -c --quiet
          tar -xzf "$f" gitleaks
          ./gitleaks git --redact --no-banner --log-opts="${BASE}..HEAD" .
