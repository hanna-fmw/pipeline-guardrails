# The shared rules for every Claude step: rules/shared.md (the one home) becomes the runner's ~/.claude/CLAUDE.md,
# which claude-code-action loads as user memory. Same kit version as the workflow; no token, no copy in any repo.
# uses: hanna-fmw/pipeline-guardrails/.github/actions/rules@v1
name: rules
description: Load the shared rules for Claude steps
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        src="$GITHUB_ACTION_PATH/../../../rules/shared.md"
        [ -s "$src" ] || { echo "::error::shared rules missing ($src)"; exit 1; } # never run Claude without them
        mkdir -p "$HOME/.claude" && cp "$src" "$HOME/.claude/CLAUDE.md"
        echo "shared rules loaded ($(wc -l < "$src") lines)"
