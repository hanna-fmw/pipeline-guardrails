# The PR pipeline and its commands. Never edit: this file is the same in every repo and only calls the kit,
# where every rule lives (hanna-fmw/pipeline-guardrails, router.yml). install.sh writes it; the daily
# check compares it with the kit's and scripts/sync.sh puts it back. Per-repo setting: repo variable
# PIPELINE_DEPTH (quick | standard | deep, default standard).
name: pipeline
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, closed]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  issues:
    types: [opened, labeled, edited, closed]

jobs:
  run:
    uses: hanna-fmw/pipeline-guardrails/.github/workflows/router.yml@v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      checks: read
