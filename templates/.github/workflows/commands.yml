# Things you can type (owner only):
#   @claude <what to do>   on a PR: Claude makes the change and pushes it to the branch
#                          in an issue (or a new issue's text): Claude does it and opens a PR
#   /gate                  re-check the gate, e.g. after resolving threads
#   /revert                on a merged PR: opens a PR that undoes it
# Adding the owner-approved label also re-checks the gate; merging or closing a PR updates its Slack message.
name: commands
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [labeled, closed]
  issues:
    types: [opened]

jobs:
  fix:
    if: >-
      ((github.event_name == 'pull_request_review_comment' || github.event_name == 'issue_comment')
        && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER')
      || (github.event_name == 'issues'
        && contains(github.event.issue.body, '@claude') && github.event.issue.author_association == 'OWNER')
    uses: hanna-fmw/pipeline-guardrails/.github/workflows/claude-fix.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

  gate:
    if: >-
      (github.event_name == 'pull_request' && (github.event.action == 'closed' || github.event.label.name == 'owner-approved'))
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request
          && startsWith(github.event.comment.body, '/gate') && github.event.comment.author_association == 'OWNER')
    uses: hanna-fmw/pipeline-guardrails/.github/workflows/gate.yml@main
    with:
      pr: ${{ github.event.pull_request.number || github.event.issue.number }}
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read

  revert:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/revert') && github.event.comment.author_association == 'OWNER'
    uses: hanna-fmw/pipeline-guardrails/.github/workflows/revert.yml@main
    with:
      pr: ${{ github.event.issue.number }}
    permissions:
      contents: write
      pull-requests: write
