# Backups (3-2-1): twice a day to a Google shared drive (or R2). Setup and restore: RESTORE.md.
name: backup
on:
  schedule:
    - cron: "0 5,17 * * *" # UTC; GitHub may start scheduled runs late
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    permissions:
      contents: read
      id-token: write # lets the run log in to Google without a stored key
    uses: hanna-fmw/pipeline-guardrails/.github/workflows/backup.yml@main
    with:
      project: <short-name>
      dest: drive # or r2 (then: bucket, and the R2_* secrets)
      drive_id: <shared drive id>
      gcp_provider: projects/<project number>/locations/global/workloadIdentityPools/github/providers/<repo>
      gcp_service_account: backup-writer@<gcp project>.iam.gserviceaccount.com
      pg_host: <session pooler host>
      pg_user: postgres.<project ref>
      must_have_tables: <2-5 tables that always hold data>
      storage_endpoint: https://<project ref>.supabase.co/storage/v1/s3
      storage_region: <project region>
    secrets:
      PG_PASSWORD: ${{ secrets.BACKUP_PG_PASSWORD }}
      STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
      STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
