# .github/dependabot.yml
# GitHub-native automated dependency PRs. Free, scoped per-ecosystem.
# Pairs with weekly-audit.yml: audit *reports* drift, Dependabot *fixes* it.

version: 2
updates:
  # --- npm / pnpm ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 5
    labels: ["area:deps", "automated"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Group non-major updates into one PR per category — fewer PRs to review.
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      prod-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    ignore:
      # Pin major versions you don't want auto-bumped (Next.js, React, etc. — bump manually).
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # --- GitHub Actions (always keep current — security-sensitive) ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["area:ci", "automated"]
    commit-message:
      prefix: "chore(ci)"

  # --- Docker (if applicable) ---
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["area:docker", "automated"]
    commit-message:
      prefix: "chore(docker)"
