name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; a job that needs more grants it for itself.
# https://docs.github.com/en/actions/reference/security/secure-use
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec prettier --check .

  secret-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write     # required for GITLEAKS_ENABLE_COMMENTS
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # full history for scan
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true

      # Second pass over just this PR's commits. The full-history pass can be
      # noisy on an old repo; this one fails only on what the PR itself adds,
      # so it is the pass worth making a required check.
      - name: gitleaks (PR diff)
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git --no-banner --redact \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  typecheck:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-24.04
    needs: typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --run

  build:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Dummy values — build must succeed without real secrets.
          # Real values come from Vercel/Coolify at deploy time.
          NEXT_PUBLIC_APP_URL: http://localhost:3000
