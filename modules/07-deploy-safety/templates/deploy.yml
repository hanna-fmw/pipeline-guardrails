name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# VERCEL_ORG_ID and VERCEL_PROJECT_ID pin every command to ONE project in ONE
# account. Without them, a `vercel` command in CI can link or create a project
# under whatever scope the token owns — the cross-account accident module 08
# denies `vercel link` to prevent. These are identifiers, not secrets, but
# repo variables keep them out of the diff noise.
env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-flight deploy

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: bash ./scripts/preflight.sh staging
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy-staging:
    needs: preflight
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      # Documented CI flow: pull env -> build in CI -> deploy the prebuilt output.
      # https://vercel.com/docs/git/vercel-for-github#using-github-actions
      # Building here rather than on Vercel keeps the source out of the platform
      # build step and makes the artifact reproducible from this run's logs.
      - name: Vercel deploy (staging)
        id: deploy
        run: |
          npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx vercel build --token="$VERCEL_TOKEN"
          url=$(npx vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: bash ./scripts/smoke-test.sh "${{ steps.deploy.outputs.url }}"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-24.04
    environment:
      name: production
      # Configure required reviewers on this environment in GitHub Settings.
    steps:
      - uses: actions/checkout@v7
      - run: bash ./scripts/preflight.sh production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Vercel deploy (production)
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: bash ./scripts/smoke-test.sh "${{ vars.PRODUCTION_URL }}"
