name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-flight deploy

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: bash ./scripts/preflight.sh staging
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy-staging:
    needs: preflight
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Vercel deploy (staging)
        id: deploy
        run: |
          url=$(npx vercel --token=$VERCEL_TOKEN --yes)
          echo "url=$url" >> $GITHUB_OUTPUT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: bash ./scripts/smoke-test.sh "${{ steps.deploy.outputs.url }}"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-24.04
    environment:
      name: production
      # Configure required reviewers on this environment in GitHub Settings.
    steps:
      - uses: actions/checkout@v4
      - run: bash ./scripts/preflight.sh production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Vercel deploy (production)
        run: npx vercel --prod --token=$VERCEL_TOKEN --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: bash ./scripts/smoke-test.sh "${{ vars.PRODUCTION_URL }}"
